table{width:100%;border-collapse:collapse;font-size:15px}

<script>
(() => {
const T = THREE;
const S = 1 / 20, KEY = 'rudnik-gamelab-v3';
const cv = document.getElementById('c');
const $ = id => document.getElementById(id);
const moneyEl = $('money'), moneyVal = $('moneyVal'), toastEl = $('toast');
const modal = $('modal'), sheet = $('sheet'), ov = $('ov');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Baloo 2", ui-rounded, system-ui, sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const X = x => x * S, Z = y => y * S;

/* ---------- Produtos anunciantes ---------- */
const PRODUCTS = [
  {name:'Café',     dept:'Mercearia',  emoji:'☕', color:'#7a4a2a', slogan:'Café forte pra começar cedo.',      price:5, style:'pack',   body:'#5a3520', band:'#e0b04a'},
  {name:'Leite',    dept:'Laticínios', emoji:'🥛', color:'#2e7bd6', slogan:'Fresquinho todo dia na sua mesa.', price:4, style:'carton', body:'#f6f8fa', band:'#2e7bd6'},
  {name:'Arroz',    dept:'Grãos',      emoji:'🍚', color:'#d99a12', slogan:'Soltinho em toda refeição.',       price:6, style:'bag',    body:'#f4e2a8', band:'#d9452b'},
  {name:'Refri',    dept:'Bebidas',    emoji:'🥤', color:'#e23b3b', slogan:'Gelado do jeito que o calor pede.', price:7, style:'bottle', body:'#e23b3b', band:'#ffffff'},
  {name:'Feijão',   dept:'Grãos',      emoji:'🫘', color:'#8a3b1c', slogan:'Caldo grosso de domingo.',         price:6, style:'bag',    body:'#6e2a16', band:'#f2c230'},
  {name:'Óleo',     dept:'Mercearia',  emoji:'🧴', color:'#c99a12', slogan:'Fritura sequinha e dourada.',      price:7, style:'bottle', body:'#f2c94c', band:'#2f8f3a'},
  {name:'Macarrão', dept:'Massas',     emoji:'🍝', color:'#2e5eaa', slogan:'Al dente em dez minutos.',         price:5, style:'pack',   body:'#f3d27a', band:'#2e5eaa'},
  {name:'Açúcar',   dept:'Mercearia',  emoji:'🍬', color:'#4b74c9', slogan:'Docinho na medida certa.',         price:4, style:'bag',    body:'#ffffff', band:'#4b74c9'},
  {name:'Biscoito', dept:'Snacks',     emoji:'🍪', color:'#f08a24', slogan:'Crocante até a última migalha.',   price:6, style:'pack',   body:'#f08a24', band:'#6b3e22'},
  {name:'Sabão',    dept:'Limpeza',    emoji:'🧼', color:'#1d8fd1', slogan:'Roupa limpa, cheiro de sol.',      price:8, style:'carton', body:'#7fd3ff', band:'#1d5fa8'},
  {name:'Suco',     dept:'Bebidas',    emoji:'🧃', color:'#3fa66b', slogan:'Fruta de verdade na caixinha.',    price:5, style:'carton', body:'#ffb21f', band:'#3fa66b'},
  {name:'Água',     dept:'Bebidas',    emoji:'💧', color:'#3aa0d8', slogan:'Hidratação o dia inteiro.',        price:3, style:'bottle', body:'#bfe6fb', band:'#2e7bd6'},
];

/* ---------- Mapas: layout e produtos mudam a cada loja ---------- */
const LAYOUTS = {
  A:{W:420, H:840, g:[[110,262],[305,262],[110,392],[305,392]], px:[60,155,250,345], caixa:[210,562], pile:[330,568], aisle:372, led1:[38,478], led2:[62,772], rep:[210,196], op:[92,562]},
  C:{W:420, H:940, g:[[110,262],[305,262],[110,382],[305,382],[110,502]], px:[50,130,210,290,370], caixa:[210,662], pile:[330,668], aisle:372, led1:[38,600], led2:[62,872], rep:[210,196], op:[92,662]},
};
function mirror(L){
  const m = x => L.W - x, mp = ([x, y]) => [m(x), y];
  return {...L, g:L.g.map(mp), px:L.px.map(m), caixa:mp(L.caixa), pile:mp(L.pile), aisle:m(L.aisle), led1:mp(L.led1), led2:mp(L.led2), rep:mp(L.rep), op:mp(L.op)};
}
function layoutFor(n){
  if (n === 1) return LAYOUTS.A;
  const k = (n - 2) % 4, base = [LAYOUTS.C, LAYOUTS.A, LAYOUTS.C, LAYOUTS.A][k];
  return [false, true, true, false][k] ? mirror(base) : base;
}
function productsFor(n, count){
  if (n === 1) return [0, 1, 2, 3];
  let start = 4; for (let k = 2; k < n; k++) start += layoutFor(k).g.length;
  return Array.from({length:count}, (_, i) => (start + i) % PRODUCTS.length);
}
let mapN = 1;
try { const s0 = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s0 && s0.map) mapN = Math.max(1, s0.map | 0); } catch(e){}
const L = layoutFor(mapN), W = L.W, H = L.H;
const CM = Math.pow(1.6, mapN - 1), PM = Math.pow(1.5, mapN - 1);
const BRANDS = productsFor(mapN, L.g.length).map(i => ({...PRODUCTS[i], price:Math.round(PRODUCTS[i].price * PM)}));

/* ---------- Mundo (lógica em px, 20 px = 1 unidade 3D) ---------- */
const gondolas = BRANDS.map((b, i) => ({brand:i, x:L.g[i][0], y:L.g[i][1], w:118, d:28, stock:i === 0 ? 5 : 0, max:15, active:i === 0}));
const pallets = BRANDS.map((b, i) => ({brand:i, x:L.px[i], y:128, w:66, d:40, stock:0, max:12, t:0, active:i === 0}));
const caixa = {x:L.caixa[0], y:L.caixa[1], w:130, d:34};
const SPOT = {x:caixa.x, y:caixa.y - 42};
const pile = {x:L.pile[0], y:L.pile[1], amount:0};
const AX = L.aisle, QX = caixa.x, QY = caixa.y + 52, EX = W / 2;
/* ---------- Mídias da loja: mudam de tipo e de lugar a cada mapa ---------- */
const MEDIA = {

function drawAd(c, w, h, b){
  const B = BRANDS[b];
  const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, B.color); gr.addColorStop(1, '#17232b');
  c.fillStyle = gr; c.fillRect(0, 0, w, h);
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  if (w === h){
    c.clearRect(0, 0, w, h);
    c.beginPath(); c.arc(w / 2, h / 2, w / 2 - 4, 0, Math.PI * 2); c.fillStyle = '#ffffff'; c.fill();
    c.beginPath(); c.arc(w / 2, h / 2, w / 2 - 14, 0, Math.PI * 2); c.fillStyle = B.color; c.fill();
    c.fillStyle = '#fff'; c.font = `${w * .26}px sans-serif`; c.fillText(B.emoji, w / 2, h * .36);
    c.font = `800 ${w * .13}px ${FONT}`; c.fillText(B.name, w / 2, h * .62);
    c.font = `600 ${w * .07}px ${FONT}`; c.fillText('PROMOÇÃO AQUI', w / 2, h * .76);
    return;
  }
  if (w < h){
    c.font = `${w * .55}px sans-serif`; c.fillText(B.emoji, w / 2, h * .38);
    c.font = `800 ${w * .2}px ${FONT}`; c.fillText(B.name.length > 7 ? B.name.slice(0, 7) + '.' : B.name, w / 2, h * .7);
    c.font = `600 ${w * .12}px ${FONT}`; c.fillText('Oferta', w / 2, h * .86);
  } else {
    c.font = `${h * .55}px sans-serif`; c.fillText(B.emoji, w * .2, h / 2);
    c.textAlign = 'left'; c.font = `800 ${h * .26}px ${FONT}`; c.fillText(B.name, w * .38, h * .42);
    c.font = `600 ${h * .13}px ${FONT}`; c.fillText(B.dept + ' em oferta', w * .38, h * .7);
  }
}

function update(dt){

        save();

  }

  spawnT -= dt;
  if (spawnT <= 0 && customers.length < 10){
    spawnT = spawnEvery * (.8 + Math.random() * .4);
    const ab = activeBrands(), n = Math.min(ab.length, 1 + (Math.random() < .45 ? 1 : 0));
    const wants = [...ab].sort(() => Math.random() - .5).slice(0, n), g = gondolas[wants[0]];
    customers.push({id:++custId, x:EX + (Math.random() * 16 - 8), y:H + 24, wants, got:[], state:'toG', g, t:0, wait:0,
      path:[{x:EX, y:H - 70}, {x:AX, y:H - 120}, {x:AX, y:g.y + g.d/2 + 16}, gSpot(g)],

function celebrate(tile){

  }
  sun.position.set(camT.x - 4, 22, camT.z + 10); sun.target.position.copy(camT);

  for (const g of gondolas){ g.g.visible = g.active; g.items.forEach((it, i) => it.visible = i < g.stock); }
  for (const p of pallets){ p.g.visible = p.active; p.items.forEach((it, i) => it.visible = i < p.stock); }
  screens.forEach(s => s.g.visible = s.active);
  spotRing.visible = !operator.active;
  spotRing.material.color.set(Math.hypot(player.x - SPOT.x, player.y - SPOT.y) < 38 ? '#3fa66b' : '#0f6e68');
  const nb = Math.min(Math.ceil(pile.amount / 3), bills.length); bills.forEach((b, i) => b.visible = i < nb);
  const tile = tiles[step];
  tileMesh.visible = !!tile;
  if (tile){
    tileMesh.position.set(X(tile.x), .02, Z(tile.y));
    const k = step + ':' + paid; if (k !== tileKey){ tileKey = k; tileTex.redraw(); }
  }

  syncPerson(playerP, player, dt, player.stack);
  helperP.root.visible = helper.active; if (helper.active) syncPerson(helperP, helper, dt, helper.stack);
  operatorP.root.visible = operator.active; if (operator.active) syncPerson(operatorP, operator, dt);
  for (const c of customers) syncPerson(c.P, c, dt, null, c.got);

  for (const p of parts){
    const u = p.t / p.dur;
    p.m.position.set(p.x0 + (p.x1 - p.x0) * u, p.h0 + (p.h1 - p.h0) * u + Math.sin(Math.PI * u) * 1.4, p.z0 + (p.z1 - p.z0) * u);
    p.m.rotation.y = u * 4;
  }

  const obj = objective();
  let nc = 0;
  if (obj && !cine){
    const sx = X(player.x), sz = Z(player.y), dx = X(obj.x) - sx, dz = Z(obj.y) - sz, d = Math.hypot(dx, dz);
    if (d > 2.4){
      const ux = dx / d, uz = dz / d, th = Math.atan2(-ux, -uz), spc = 1.1, off = reduced ? 0 : (clock * 1.8) % spc;
      for (let s = 1 + off; s < d - 1.3 && nc < chev.length; s += spc){
        const m = chev[nc++]; m.visible = true;
        m.position.set(sx + ux * s, .035, sz + uz * s); m.rotation.set(-Math.PI / 2, 0, th);
        m.material.opacity = clamp(Math.min(s - .9, d - 1.3 - s), 0, 1) * .95;
      }
    }
  }
  for (; nc < chev.length; nc++) chev[nc].visible = false;
  arrow.visible = !!obj;
  if (obj){
    arrow.position.set(X(obj.x), obj.h + (reduced ? 0 : Math.abs(Math.sin(clock * 4)) * .45), Z(obj.y));
    arrow.rotation.y = clock * 1.5;
  }

  // rótulos
  for (const p of pallets) if (p.active){
    ui('pl' + p.brand, p.x, .3, p.y + 26, `${BRANDS[p.brand].emoji} ${BRANDS[p.brand].name}`, 'tag');
    if (p.stock >= p.max) ui('pm' + p.brand, p.x, 1.8, p.y, 'MÁX', 'max');
  }
  for (const g of gondolas) if (g.active && g.stock === 0) ui('gv' + g.brand, g.x, 3.7, g.y, 'Vazio!', 'warn');
  if (tile) ui('tl', tile.x, .1, tile.y - 40, tile.label, 'lbl');
  if (player.stack.length >= player.cap) ui('xm', player.x, 4.4, player.y, 'MÁX', 'max');
  const face = w => w < 4 ? '😊' : w < 8 ? '😐' : '😠';
  const mood = w => w < 4 ? 'ok' : w < 8 ? 'mid' : 'bad';
  for (const c of customers){
    const k = 'c' + c.id;
    if (c.state === 'atG' && c.g.stock === 0) ui(k, c.x, 3.2, c.y, `${BRANDS[c.g.brand].emoji} ${face(c.wait)}`, 'bub ' + mood(c.wait));
    else if (c.state === 'queue' && c.arrived){
      if (c === queue[0] && c.t > 0) ui(k, c.x, 3.1, c.y, `<div class="ring" style="--p:${Math.round(Math.min(1, c.t / .7) * 100)}%"></div>`, '');
      else { const w = c.qwait / 2; ui(k, c.x, 3.2, c.y, (c === queue[0] ? '💵 ' : '') + face(w), 'bub ' + mood(w)); }
    }
    else if (c.happy > 0) ui(k, c.x, 3.2, c.y, '😄', 'bub ok');
    else if (c.angry > 0) ui(k, c.x, 3.2, c.y, '😡', 'bub bad');
  }
  if (obj){
    const p = toScreen(arrow.position.x, arrow.position.y, arrow.position.z), m = 30;
    if (p.x < m || p.x > cw - m || p.y < 110 || p.y > ch - m){
      const ang = Math.atan2(p.y - ch / 2, p.x - cw / 2);
      const el = ui('edge', 0, 0, 0, '', 'edge');
      el.style.transform = `translate(${clamp(p.x, m, cw - m)}px,${clamp(p.y, 112, ch - m)}px) translate(-50%,-50%) rotate(${ang}rad)`;
    }
  }
  for (const s of screens) if (s.active && s.gt !== undefined && s.gt < 1.4){
    const el = ui('fl' + s.id, s.x, s.top + s.gt * 1.2, s.y, `+${s.gain} 💵`, 'gain');
    el.style.opacity = String(Math.min(1, (1.4 - s.gt) * 2));
  }
  uiEnd();

  if (joy.active){
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, d = Math.hypot(dx, dy), m = Math.min(d, 40);
    joyEl.style.display = knobEl.style.display = 'block';
    joyEl.style.left = joy.sx + 'px'; joyEl.style.top = joy.sy + 'px';
    knobEl.style.left = (d ? joy.sx + dx / d * m : joy.sx) + 'px'; knobEl.style.top = (d ? joy.sy + dy / d * m : joy.sy) + 'px';
  } else joyEl.style.display = knobEl.style.display = 'none';
  hintEl.style.display = moved ? 'none' : '';
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { redraws.forEach(r => r()); tileKey = ''; });

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  if (!paused) update(dt);
  sync(dt);
  renderer.render(scene, camera);
});
})();
</script>
</body>
</html>
